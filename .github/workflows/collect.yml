name: Collect official market snapshot

# The inherit monitor uploads each hourly snapshot to raw/ right after it is published (pushed with a personal token,
# so it triggers this workflow; commits made here with GITHUB_TOKEN do not). Those pushes only rebuild daily/ and
# summary.json; the schedule stays as a fallback that fetches the snapshot itself.
on:
  push:
    branches: [main]
    paths: ['raw/**']
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            daily
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Archive the official snapshot, or rebuild days from pushed raw snapshots
        run: node scripts/collect.mjs --sparse ${{ github.event_name == 'push' && '--aggregate' || '' }}
      - name: Commit and push archive updates
        shell: bash
        run: |
          git add --sparse raw daily summary.json
          if git diff --cached --quiet; then
            echo 'Snapshot already archived; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): archive official hourly market snapshot'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            git -c remote.origin.promisor=true -c remote.origin.partialclonefilter=blob:none fetch --filter=blob:none origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
